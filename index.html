<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassCraft SMP - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase-config.js"></script>
    <script src="assets/app-data.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full mb-3">
                <i class="fas fa-shapes text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">ClassCraft SMP</h1>
            <p class="text-xs text-slate-500 mt-1">Sistem Administrasi Guru & Sekolah</p>
        </div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username / NIP Guru</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-user"></i></span>
                    <input type="text" id="login-username" required placeholder="NIP atau admin" class="w-full pl-10 pr-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-lock"></i></span>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div id="login-error" class="hidden text-xs text-rose-700 bg-rose-50 p-2.5 rounded-lg border border-rose-200"></div>

            <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-md cursor-pointer">
                Masuk ke Sistem <i class="fas fa-arrow-right ml-1"></i>
            </button>
        </form>
    </div>

    <script>
        const errBox = document.getElementById('login-error');

        function tampilkanError(msg) {
            errBox.textContent = msg;
            errBox.classList.remove('hidden');
        }

        // Event Submit Form Login (mendukung tombol Enter)
        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            errBox.classList.add('hidden');

            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();

            if (!u || !p) {
                tampilkanError('Silakan isi Username/NIP dan Password terlebih dahulu.');
                return;
            }

            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Memeriksa...';
            try {
                const hasil = await CC.loginDetailed(u, p);
                if (hasil.user) {
                    CC.setSession(hasil.user);
                    window.location.href = CC.homeFor(hasil.user.role);
                } else {
                    tampilkanError(hasil.error || 'NIP/Username atau Password salah.');
                }
            } catch (err) {
                console.error(err);
                tampilkanError('Gagal login: ' + (err.message || err));
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Masuk ke Sistem <i class="fas fa-arrow-right ml-1"></i>';
            }
        });
    </script>
</body>
</html>
