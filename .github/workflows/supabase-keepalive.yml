name: Supabase Keep-Alive (cadangan manual)

# Workflow ini TIDAK lagi menggunakan schedule harian karena GitHub menonaktifkan
# scheduled workflow jika repositori tidak aktif selama 60 hari.
# Pemicu utama Supabase keep-alive dialihkan ke cron eksternal yang memanggil
# Edge Function publik `keepalive`:
#   https://dfmzgyxrdifzlogjxuwi.supabase.co/functions/v1/keepalive
# Lihat KEEPALIVE.md untuk cara setup cron eksternal (cron-job.org / Cloudflare Worker).
# Workflow ini hanya cadangan yang bisa dijalankan manual dari tab Actions.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Edge Function keepalive
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL || 'https://dfmzgyxrdifzlogjxuwi.supabase.co/functions/v1/keepalive' }}
        run: |
          echo "Pinging $KEEPALIVE_URL"
          http_code=$(curl -s -o /tmp/keepalive_response.txt -w "%{http_code}" \
            -X POST "$KEEPALIVE_URL" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $http_code"
          cat /tmp/keepalive_response.txt
          if [ "$http_code" != "200" ]; then
            echo "Keep-alive gagal (HTTP $http_code)"
            exit 1
          fi
