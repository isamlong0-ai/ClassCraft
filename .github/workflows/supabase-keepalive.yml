name: Supabase Keep-Alive (cegah auto-pause)

# Supabase free-tier akan di-pause otomatis jika tidak ada request/aktivitas.
# Workflow ini memanggil RPC `public.keepalive()` (SELECT 1) setiap hari,
# sehingga proyek tetap "aktif". Tidak membutuhkan secret khusus; anon key
# yang sudah publik dipakai. Jika ingin override, buat secret repo
# SUPABASE_ANON_KEY / SUPABASE_URL.

on:
  schedule:
    - cron: "17 3 * * *"   # setiap hari jam 03:17 UTC
  workflow_dispatch:        # bisa di-trigger manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keepalive()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dfmzgyxrdifzlogjxuwi.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_8S5NrIjfV6BRmpVblz8kzA__QD6ZGvt' }}
        run: |
          echo "Pinging $SUPABASE_URL/rest/v1/rpc/keepalive"
          http_code=$(curl -s -o /tmp/keepalive_response.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $http_code"
          cat /tmp/keepalive_response.txt
          if [ "$http_code" != "200" ]; then
            echo "Keep-alive gagal (HTTP $http_code)"
            exit 1
          fi
