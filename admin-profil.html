<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Profil & Sistem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase-config.js"></script>
    <script src="assets/app-data.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <i class="fas fa-shapes text-2xl text-amber-300"></i>
                <div>
                    <h1 class="text-lg font-bold" id="header-sekolah">ClassCraft Admin</h1>
                    <p class="text-[10px] text-indigo-200" id="header-ta-info">T.A: - | Semester: -</p>
                </div>
            </div>
            <nav class="flex flex-wrap justify-end gap-1 sm:gap-2 text-xs font-medium">
                <a href="admin-profil.html" class="bg-indigo-900 px-3 py-2 rounded-lg"><i class="fas fa-school mr-1"></i> Profil Sekolah</a>
                <a href="admin-guru.html" class="hover:bg-indigo-600 px-3 py-2 rounded-lg transition"><i class="fas fa-users-cog mr-1"></i> Data Guru</a>
                '<a href="admin-kelas.html" class="hover:bg-indigo-600 px-3 py-2 rounded-lg transition"><i class="fas fa-door-open mr-1"></i> Kelola Kelas</a>
                <a href="admin-backup.html" class="hover:bg-indigo-600 px-3 py-2 rounded-lg transition"><i class="fas fa-database mr-1"></i> Backup & Restore</a>'
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg transition"><i class="fas fa-sign-out-alt"></i></button>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-1 space-y-6">
        
        <!-- Pengaturan Profil Sekolah & Tahun Ajaran -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="text-base font-bold text-indigo-700 border-b pb-2 mb-4"><i class="fas fa-school mr-2"></i>Profil Sekolah & Pengaturan Akademik</h2>
            
            <form onsubmit="simpanSekolah(event)" class="space-y-4">
                <!-- Tahun Ajaran & Semester Aktif -->
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-indigo-900 mb-1">Tahun Ajaran Aktif</label>
                        <select id="cfg-ta" class="w-full p-2 border rounded-lg text-sm bg-white font-semibold text-indigo-700">
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-indigo-900 mb-1">Semester Aktif</label>
                        <select id="cfg-semester" disabled class="w-full p-2 border rounded-lg text-sm bg-slate-100 font-semibold text-slate-500 cursor-not-allowed">
                            <option value="Ganjil">Semester Ganjil (Jul–Des)</option>
                            <option value="Genap">Semester Genap (Jan–Jun)</option>
                        </select>
                        <p class="text-[10px] text-slate-500 mt-1"><i class="fas fa-clock mr-1"></i>Otomatis dari tanggal: Jan–Jun = Genap, Jul–Des = Ganjil.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Nama Sekolah</label>
                        <input type="text" id="cfg-nama" required class="w-full mt-1 p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">NPSN</label>
                        <input type="text" id="cfg-npsn" required class="w-full mt-1 p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Nama Kepala Sekolah & Gelar</label>
                        <input type="text" id="cfg-kepsek" required class="w-full mt-1 p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">NIP Kepala Sekolah</label>
                        <input type="text" id="cfg-kepsek-nip" required class="w-full mt-1 p-2 border rounded-lg text-sm">
                    </div>
                </div>

                <div class="border-t pt-4 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Upload KOP Surat Sekolah</label>
                        <input type="file" accept="image/*" onchange="previewImg(this, 'preview-kop', 'imgKop')" class="text-xs w-full border p-2 rounded-lg">
                        <div class="mt-2 border rounded-lg p-2 bg-slate-50 flex items-center justify-center min-h-[80px]">
                            <img id="preview-kop" src="" class="max-h-20 hidden object-contain">
                            <span id="txt-kop" class="text-xs text-slate-400">Belum ada KOP</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Upload TTD Kepala Sekolah (PNG Transparan)</label>
                        <input type="file" accept="image/*" onchange="previewImg(this, 'preview-ttd', 'imgTtd')" class="text-xs w-full border p-2 rounded-lg">
                        <div class="mt-2 border rounded-lg p-2 bg-slate-50 flex items-center justify-center min-h-[80px]">
                            <img id="preview-ttd" src="" class="max-h-20 hidden object-contain">
                            <span id="txt-ttd" class="text-xs text-slate-400">Belum ada TTD</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-medium transition"><i class="fas fa-save mr-1"></i> Simpan Pengaturan Sekolah</button>
            </form>
        </div>

    </main>

    <script>
        let session = CC.getSession();

        if (!session) {
            window.location.replace('index.html');
            throw new Error('Akses ditolak: silakan login terlebih dahulu.');
        }
        if (session.role !== 'admin') {
            window.location.replace(CC.homeFor(session.role));
            throw new Error('Akses ditolak: halaman ini khusus admin.');
        }

        let dbSekolah = Object.assign({}, CC.defaults.sekolah);

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                dbSekolah = await CC.getSekolah();
            } catch (e) {
                console.error('Gagal memuat profil sekolah:', e);
            }

            document.getElementById('header-sekolah').innerText = dbSekolah.nama;
            document.getElementById('header-ta-info').innerText = `T.A: ${dbSekolah.tahunAjaran || '2026/2027'} | Semester: ${dbSekolah.semester || 'Ganjil'}`;

            document.getElementById('cfg-nama').value = dbSekolah.nama;
            document.getElementById('cfg-npsn').value = dbSekolah.npsn;
            document.getElementById('cfg-kepsek').value = dbSekolah.kepsek;
            document.getElementById('cfg-kepsek-nip').value = dbSekolah.nipKepsek;
            // Tahun ajaran: hanya tampilkan TA aktif dan TA berikutnya (hanya bertambah ke depan).
            const taAktif = dbSekolah.tahunAjaran || '2026/2027';
            const taBerikut = CC.tahunAjaranBerikutnya(taAktif) || taAktif;
            const selTA = document.getElementById('cfg-ta');
            selTA.innerHTML = '';
            [taAktif, taBerikut].forEach((ta) => {
                const opt = document.createElement('option');
                opt.value = ta;
                opt.textContent = ta;
                selTA.appendChild(opt);
            });
            selTA.value = taAktif;
            document.getElementById('cfg-semester').value = dbSekolah.semester || 'Ganjil';

            if(dbSekolah.imgKop) {
                document.getElementById('preview-kop').src = dbSekolah.imgKop;
                document.getElementById('preview-kop').classList.remove('hidden');
                document.getElementById('txt-kop').classList.add('hidden');
            }
            if(dbSekolah.imgTtd) {
                document.getElementById('preview-ttd').src = dbSekolah.imgTtd;
                document.getElementById('preview-ttd').classList.remove('hidden');
                document.getElementById('txt-ttd').classList.add('hidden');
            }
        });

        function previewImg(input, imgId, key) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(imgId).src = e.target.result;
                    document.getElementById(imgId).classList.remove('hidden');
                    dbSekolah[key] = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        async function simpanSekolah(e) {
            e.preventDefault();
            dbSekolah.nama = document.getElementById('cfg-nama').value.trim();
            dbSekolah.npsn = document.getElementById('cfg-npsn').value.trim();
            dbSekolah.kepsek = document.getElementById('cfg-kepsek').value.trim();
            dbSekolah.nipKepsek = document.getElementById('cfg-kepsek-nip').value.trim();
            dbSekolah.tahunAjaran = document.getElementById('cfg-ta').value;
            dbSekolah.semester = CC.semesterSaatIni();

            try {
                await CC.saveSekolah(dbSekolah);
                alert('Pengaturan sekolah & Tahun Ajaran berhasil disimpan!');
                location.reload();
            } catch (err) {
                console.error(err);
                alert('Gagal menyimpan: ' + (err.message || err));
            }
        }

        function logout() {
            CC.logout().finally(() => { window.location.href = 'index.html'; });
        }
    </script>
</body>
</html>
