<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Data Guru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase-config.js"></script>
    <script src="assets/app-data.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <i class="fas fa-shapes text-2xl text-amber-300"></i>
                <h1 class="text-lg font-bold" id="header-sekolah">ClassCraft Admin</h1>
            </div>
            <nav class="flex flex-wrap justify-end gap-1 sm:gap-2 text-xs font-medium">
                <a href="admin-profil.html" class="hover:bg-indigo-600 px-3 py-2 rounded-lg transition"><i class="fas fa-school mr-1"></i> Profil Sekolah</a>
                <a href="admin-guru.html" class="bg-indigo-900 px-3 py-2 rounded-lg"><i class="fas fa-users-cog mr-1"></i> Data Guru</a>
                <a href="admin-kelas.html" class="hover:bg-indigo-600 px-3 py-2 rounded-lg transition"><i class="fas fa-door-open mr-1"></i> Kelola Kelas</a>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg transition"><i class="fas fa-sign-out-alt"></i></button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="bg-white p-6 rounded-xl shadow-md border space-y-6">
                <div>
                    <h2 class="text-base font-bold text-indigo-700 border-b pb-2 mb-3"><i class="fas fa-file-upload mr-2"></i>Upload Data Guru Massal</h2>
                    <p class="text-[10px] text-slate-500 mb-1">Format: <code class="bg-slate-100 p-0.5 text-indigo-600">NIP, Nama, Mapel, Pangkat, Golongan</code></p>
                    <textarea id="import-guru" rows="4" placeholder="198001012005011001, Budi Santoso S.Pd, PPKn, Pembina, IV/a" class="w-full p-2 border rounded-lg text-xs font-mono"></textarea>
                    <button onclick="importGuru()" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-xs font-medium transition">Proses Upload</button>
                </div>

                <div class="border-t pt-4">
                    <h3 class="text-xs font-bold text-slate-700 mb-2">Input Manual Guru:</h3>
                    <form onsubmit="tambahGuru(event)" class="space-y-2">
                        <input type="text" id="add-nip" required placeholder="NIP (18 Digit)" class="w-full p-2 border rounded text-xs">
                        <input type="text" id="add-nama" required placeholder="Nama Lengkap & Gelar" class="w-full p-2 border rounded text-xs">
                        <input type="text" id="add-mapel" required placeholder="Mata Pelajaran" class="w-full p-2 border rounded text-xs">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="add-pangkat" placeholder="Pangkat (Pembina)" class="w-full p-2 border rounded text-xs">
                            <input type="text" id="add-gol" placeholder="Golongan (IV/a)" class="w-full p-2 border rounded text-xs">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded text-xs font-medium transition">Tambah Guru</button>
                    </form>
                </div>
            </div>

            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-md border">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h2 class="text-base font-bold text-indigo-700"><i class="fas fa-users mr-2"></i>Daftar Guru & Kepegawaian</h2>
                    <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded transition font-medium"><i class="fas fa-file-excel mr-1"></i> Ekspor Excel</button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 border-b">
                                <th class="p-2.5">NIP</th>
                                <th class="p-2.5">Nama Guru</th>
                                <th class="p-2.5">Mapel</th>
                                <th class="p-2.5">Pangkat / Golongan</th>
                                <th class="p-2.5 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-guru" class="divide-y"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let session = CC.getSession();

        if (!session || session.role !== 'admin') {
            window.location.replace('login.html');
            throw new Error('Akses ditolak: silakan login sebagai admin.');
        }

        let dbUsers = [];
        let dbSekolah = Object.assign({}, CC.defaults.sekolah);

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const hasil = await Promise.all([CC.getUsers(), CC.getSekolah()]);
                dbUsers = hasil[0];
                dbSekolah = hasil[1];
            } catch (e) {
                console.error('Gagal memuat data:', e);
                alert('Gagal memuat data dari server. Menampilkan data tersimpan.');
            }
            document.getElementById('header-sekolah').innerText = dbSekolah.nama;
            renderTable();
        });

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderTable() {
            const tbody = document.getElementById('tabel-guru');
            tbody.innerHTML = '';
            const list = dbUsers.filter(u => u.role === 'guru');

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-3 text-slate-400">Belum ada data guru</td></tr>`;
                return;
            }

            list.forEach(g => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2.5 font-mono">${escapeHtml(g.username)}</td>
                    <td class="p-2.5 font-medium">${escapeHtml(g.nama)}</td>
                    <td class="p-2.5 text-indigo-600 font-semibold">${escapeHtml(g.mapel)}</td>
                    <td class="p-2.5">${escapeHtml(g.pangkat || '-')} / ${escapeHtml(g.gol || '-')}</td>
                    <td class="p-2.5 text-center">
                        <button onclick="resetPass('${escapeHtml(g.username)}')" class="bg-amber-500 hover:bg-amber-600 text-white text-[10px] px-2 py-1 rounded transition">Reset Pass</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function tambahGuru(e) {
            e.preventDefault();
            const nip = document.getElementById('add-nip').value.trim();
            if (dbUsers.find(x => x.username === nip)) return alert('NIP sudah terdaftar!');

            const guru = {
                username: nip, pass: 'guru123', role: 'guru',
                nama: document.getElementById('add-nama').value.trim(),
                mapel: document.getElementById('add-mapel').value.trim(),
                pangkat: document.getElementById('add-pangkat').value.trim() || '-',
                gol: document.getElementById('add-gol').value.trim() || '-'
            };

            try {
                const dibuat = await CC.addUser(guru);
                dbUsers.push(dibuat);
                renderTable();
                document.getElementById('add-nip').value = '';
                document.getElementById('add-nama').value = '';
                document.getElementById('add-mapel').value = '';
                document.getElementById('add-pangkat').value = '';
                document.getElementById('add-gol').value = '';
                alert('Guru berhasil ditambahkan!');
            } catch (err) {
                console.error(err);
                alert('Gagal menambah guru: ' + (err.message || err));
            }
        }

        async function importGuru() {
            const raw = document.getElementById('import-guru').value.trim();
            if (!raw) return alert('Isi data terlebih dahulu!');

            let berhasil = 0, dilewati = 0;
            const baris = raw.split('\n');
            for (let i = 0; i < baris.length; i++) {
                const parts = baris[i].split(',').map(s => s.trim());
                if (parts.length < 3 || !parts[0] || !parts[1]) { dilewati++; continue; }
                const [nip, nama, mapel, pangkat = '-', gol = '-'] = parts;
                if (dbUsers.find(x => x.username === nip)) { dilewati++; continue; }
                try {
                    const dibuat = await CC.addUser({ username: nip, pass: 'guru123', role: 'guru', nama, mapel: mapel || '-', pangkat: pangkat || '-', gol: gol || '-' });
                    dbUsers.push(dibuat);
                    berhasil++;
                } catch (err) {
                    console.error(err);
                    dilewati++;
                }
            }

            renderTable();
            document.getElementById('import-guru').value = '';
            alert(`Import selesai: ${berhasil} guru ditambahkan${dilewati ? `, ${dilewati} baris dilewati (tidak lengkap/duplikat/gagal)` : ''}.`);
        }

        async function resetPass(nip) {
            if (!confirm(`Reset password NIP ${nip} ke "guru123"?`)) return;
            try {
                await CC.resetPassword(nip, 'guru123');
                alert('Password di-reset!');
            } catch (err) {
                console.error(err);
                alert('Gagal reset password: ' + (err.message || err));
            }
        }

        function exportExcel() {
            const list = dbUsers.filter(u => u.role === 'guru');
            let table = `<table border="1"><tr><th>NIP</th><th>Nama</th><th>Mapel</th><th>Pangkat</th><th>Golongan</th></tr>`;
            list.forEach(g => { table += `<tr><td>'${g.username}</td><td>${g.nama}</td><td>${g.mapel}</td><td>${g.pangkat}</td><td>${g.gol}</td></tr>`; });
            table += `</table>`;

            const blob = new Blob(['\ufeff' + table], { type: 'application/vnd.ms-excel' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Data_Guru_SMP.xls'; a.click();
        }

        function logout() { CC.logout().finally(() => { window.location.href = 'login.html'; }); }
    </script>
</body>
</html>
