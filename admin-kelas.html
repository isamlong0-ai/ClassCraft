<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kelola Kelas & Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase-config.js"></script>
    <script src="assets/app-data.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <i class="fas fa-shapes text-2xl text-amber-300"></i>
                <h1 class="text-lg font-bold" id="header-sekolah">ClassCraft Admin</h1>
            </div>
            <nav class="flex flex-wrap justify-end gap-1 sm:gap-2 text-xs font-medium">
                <a href="admin-profil.html" class="hover:bg-indigo-600 px-3 py-2 rounded-lg transition"><i class="fas fa-school mr-1"></i> Profil Sekolah</a>
                <a href="admin-guru.html" class="hover:bg-indigo-600 px-3 py-2 rounded-lg transition"><i class="fas fa-users-cog mr-1"></i> Data Guru</a>
                <a href="admin-kelas.html" class="bg-indigo-900 px-3 py-2 rounded-lg"><i class="fas fa-door-open mr-1"></i> Kelola Kelas</a>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg transition"><i class="fas fa-sign-out-alt"></i></button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="bg-white p-6 rounded-xl shadow-md border space-y-4">
                <h2 class="text-base font-bold text-indigo-700 border-b pb-2"><i class="fas fa-plus-circle mr-2"></i>Buat Rombel Baru</h2>
                <form onsubmit="tambahRombel(event)" class="space-y-3">
                    <select id="add-tingkat" class="w-full p-2 border rounded text-xs">
                        <option value="Kelas 7">Kelas 7</option> <option value="Kelas 8">Kelas 8</option> <option value="Kelas 9">Kelas 9</option>
                    </select>
                    <input type="text" id="add-nama-rombel" required placeholder="Nama Kelas (contoh: 7-A)" class="w-full p-2 border rounded text-xs">
                    <select id="add-wali" class="w-full p-2 border rounded text-xs select-guru"></select>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded text-xs font-medium">Simpan Rombel</button>
                </form>

                <div class="border-t pt-3">
                    <h3 class="text-xs font-bold text-slate-700 mb-2">Daftar Rombel Terdaftar:</h3>
                    <div id="list-rombel" class="space-y-1.5 max-h-48 overflow-y-auto"></div>
                </div>
            </div>

            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-md border space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-base font-bold text-indigo-700"><i class="fas fa-user-graduate mr-2"></i>Data Siswa Per Kelas</h2>
                    <div class="flex flex-wrap items-center gap-2">
                        <label class="flex items-center gap-1 text-xs text-slate-600 bg-white border rounded px-2 py-1.5 cursor-pointer">
                            <input type="checkbox" id="filter-aktif" checked onchange="renderSiswa()" class="accent-indigo-600"> Hanya siswa aktif
                        </label>
                        <select id="select-active-rombel" onchange="renderSiswa()" class="p-1.5 border rounded text-xs font-bold text-indigo-700 bg-indigo-50"></select>
                        <button onclick="exportExcelSiswa()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded font-medium"><i class="fas fa-file-excel mr-1"></i> Ekspor Excel</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-3 rounded-lg border">
                    <div>
                        <h3 class="text-xs font-bold text-slate-700 mb-1">Upload Massal Siswa</h3>
                        <p class="text-[10px] text-slate-500 mb-1">Format: <code class="bg-white p-0.5 border">NISN, NIPD, Nama, JK (L/P)</code></p>
                        <textarea id="import-siswa" rows="3" placeholder="0081234561, 232407001, Ahmad Dahlan, L" class="w-full p-1.5 border rounded text-xs font-mono bg-white"></textarea>
                        <button onclick="importSiswa()" class="w-full mt-1 bg-emerald-600 text-white py-1 rounded text-xs font-medium">Proses Import</button>
                    </div>

                    <div>
                        <h3 class="text-xs font-bold text-slate-700 mb-1">Input Manual Siswa</h3>
                        <form onsubmit="tambahSiswa(event)" class="space-y-1.5">
                            <input type="text" id="add-nisn" required placeholder="NISN (10 Digit)" class="w-full p-1 border rounded text-xs bg-white">
                            <input type="text" id="add-nipd" placeholder="NIPD / No Induk" class="w-full p-1 border rounded text-xs bg-white">
                            <input type="text" id="add-nama-siswa" required placeholder="Nama Lengkap Siswa" class="w-full p-1 border rounded text-xs bg-white">
                            <select id="add-jk" class="w-full p-1 border rounded text-xs bg-white"><option value="L">Laki-Laki (L)</option><option value="P">Perempuan (P)</option></select>
                            <button type="submit" class="w-full bg-indigo-600 text-white py-1 rounded text-xs font-medium">Tambah Siswa</button>
                        </form>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 border-b">
                                <th class="p-2">No</th><th class="p-2">NISN</th><th class="p-2">NIPD</th><th class="p-2">Nama Siswa</th><th class="p-2 text-center">JK</th><th class="p-2 text-center">Status</th><th class="p-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-siswa" class="divide-y"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let session = CC.getSession();

        if (!session) {
            window.location.replace('index.html');
            throw new Error('Akses ditolak: silakan login terlebih dahulu.');
        }
        if (session.role !== 'admin') {
            window.location.replace(CC.homeFor(session.role));
            throw new Error('Akses ditolak: halaman ini khusus admin.');
        }

        let dbUsers = [];
        let dbSekolah = Object.assign({}, CC.defaults.sekolah);
        let dbRombel = [];

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const hasil = await Promise.all([CC.getUsers(), CC.getSekolah(), CC.getRombel()]);
                dbUsers = hasil[0];
                dbSekolah = hasil[1];
                dbRombel = hasil[2];
            } catch (e) {
                console.error('Gagal memuat data:', e);
                alert('Gagal memuat data dari server. Menampilkan data tersimpan.');
            }
            document.getElementById('header-sekolah').innerText = dbSekolah.nama;
            loadWaliList();
            renderRombel();
        });

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function loadWaliList() {
            const listGuru = dbUsers.filter(u => u.role === 'guru');
            const select = document.querySelector('.select-guru');
            select.innerHTML = `<option value="-">-- Pilih Wali Kelas --</option>`;
            listGuru.forEach(g => { select.innerHTML += `<option value="${escapeHtml(g.nama)}">${escapeHtml(g.nama)}</option>`; });
        }

        function renderRombel() {
            const cardContainer = document.getElementById('list-rombel');
            const selectActive = document.getElementById('select-active-rombel');
            // Simpan pilihan kelas yang sedang aktif agar tidak ter-reset ke kelas pertama.
            const prevActive = selectActive.value;
            cardContainer.innerHTML = ''; selectActive.innerHTML = '';

            dbRombel.forEach(r => {
                const aktifCount = r.siswa.filter(s => (s.status || 'aktif') === 'aktif').length;
                cardContainer.innerHTML += `<div class="p-2 bg-slate-50 border rounded text-xs flex justify-between gap-2">
                    <div><b>${escapeHtml(r.nama)}</b> <span class="text-[10px] text-slate-500">(${escapeHtml(r.tingkat)}${r.tahun_ajaran ? ' · ' + escapeHtml(r.tahun_ajaran) : ''})</span></div>
                    <span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">${aktifCount} Aktif</span>
                </div>`;
                selectActive.innerHTML += `<option value="${escapeHtml(r.id)}">Kelas ${escapeHtml(r.nama)}${r.tahun_ajaran ? ' — ' + escapeHtml(r.tahun_ajaran) : ''}</option>`;
            });

            if (prevActive && dbRombel.some(r => r.id === prevActive)) {
                selectActive.value = prevActive;
            }
            renderSiswa();
        }

        async function tambahRombel(e) {
            e.preventDefault();
            const nama = document.getElementById('add-nama-rombel').value.trim();
            if(dbRombel.find(r => r.nama === nama)) return alert('Nama kelas sudah ada!');

            try {
                const baru = await CC.addRombel({
                    tingkat: document.getElementById('add-tingkat').value,
                    nama: nama,
                    wali: document.getElementById('add-wali').value
                });
                dbRombel.push(baru);
                renderRombel();
                document.getElementById('add-nama-rombel').value = '';
            } catch (err) {
                console.error(err);
                alert('Gagal menyimpan rombel: ' + (err.message || err));
            }
        }

        const STATUS_LABEL = { aktif: 'Aktif', lulus: 'Lulus', pindah: 'Pindah', berhenti: 'Berhenti' };
        const STATUS_CLASS = {
            aktif: 'bg-emerald-100 text-emerald-700',
            lulus: 'bg-sky-100 text-sky-700',
            pindah: 'bg-amber-100 text-amber-700',
            berhenti: 'bg-rose-100 text-rose-700'
        };

        function statusBadge(status) {
            const key = STATUS_LABEL[status] ? status : 'aktif';
            return `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${STATUS_CLASS[key]}">${STATUS_LABEL[key]}</span>`;
        }

        function renderSiswa() {
            const activeId = document.getElementById('select-active-rombel').value;
            const hanyaAktif = document.getElementById('filter-aktif').checked;
            const tbody = document.getElementById('tabel-siswa'); tbody.innerHTML = '';
            const rombel = dbRombel.find(r => r.id === activeId);
            if (!rombel || rombel.siswa.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-3 text-slate-400">Belum ada siswa</td></tr>`; return;
            }

            const daftar = hanyaAktif
                ? rombel.siswa.filter(s => (s.status || 'aktif') === 'aktif')
                : rombel.siswa;

            if (daftar.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-3 text-slate-400">Tidak ada siswa aktif. Hilangkan centang "Hanya siswa aktif" untuk melihat arsip.</td></tr>`; return;
            }

            daftar.forEach((s, idx) => {
                const status = s.status || 'aktif';
                const aktif = status === 'aktif';
                const tombolStatus = aktif
                    ? `<button onclick="ubahStatus('${escapeHtml(s.id)}','pindah')" class="text-amber-600 hover:text-amber-800 transition" title="Tandai pindah"><i class="fas fa-right-from-bracket"></i></button>
                       <button onclick="ubahStatus('${escapeHtml(s.id)}','berhenti')" class="text-rose-500 hover:text-rose-700 transition" title="Tandai berhenti"><i class="fas fa-user-slash"></i></button>`
                    : `<button onclick="ubahStatus('${escapeHtml(s.id)}','aktif')" class="text-emerald-600 hover:text-emerald-800 transition" title="Aktifkan kembali"><i class="fas fa-rotate-left"></i></button>`;
                tbody.innerHTML += `<tr class="${aktif ? '' : 'opacity-60'}">
                    <td class="p-2">${idx+1}</td><td class="p-2 font-mono">${escapeHtml(s.nisn)}</td><td class="p-2 font-mono">${escapeHtml(s.nipd || '-')}</td>
                    <td class="p-2 font-medium">${escapeHtml(s.nama)}</td><td class="p-2 text-center">${escapeHtml(s.jk)}</td>
                    <td class="p-2 text-center">${statusBadge(status)}</td>
                    <td class="p-2 text-center space-x-2 whitespace-nowrap">
                        ${tombolStatus}
                        <button onclick="hapusSiswa('${escapeHtml(s.id)}')" class="text-slate-400 hover:text-red-600 transition" title="Hapus permanen (salah input)"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
        }

        async function ubahStatus(siswaId, status) {
            let tanggalKeluar = null;
            let keterangan = '';
            if (status !== 'aktif') {
                const tgl = prompt('Tanggal keluar (YYYY-MM-DD), kosongkan untuk hari ini:', new Date().toISOString().slice(0, 10));
                if (tgl === null) return;
                tanggalKeluar = tgl.trim() || null;
                const ket = prompt(status === 'pindah'
                    ? 'Sekolah tujuan (opsional):'
                    : 'Keterangan / alasan (opsional):', '');
                if (ket === null) return;
                keterangan = ket.trim();
            }
            try {
                await CC.setStatusSiswa(siswaId, status, { tanggalKeluar, keterangan });
                dbRombel = await CC.getRombel();
                renderRombel();
            } catch (err) {
                console.error(err);
                alert('Gagal mengubah status siswa: ' + (err.message || err));
            }
        }

        async function tambahSiswa(e) {
            e.preventDefault();
            const activeId = document.getElementById('select-active-rombel').value;
            const rombel = dbRombel.find(r => r.id === activeId);
            if (!rombel) return alert('Pilih kelas terlebih dahulu.');

            try {
                const dibuat = await CC.addSiswa(activeId, {
                    nisn: document.getElementById('add-nisn').value.trim(),
                    nipd: document.getElementById('add-nipd').value.trim() || '-',
                    nama: document.getElementById('add-nama-siswa').value.trim(),
                    jk: document.getElementById('add-jk').value
                });
                rombel.siswa.push(dibuat);
                renderRombel();
                document.getElementById('add-nisn').value = ''; document.getElementById('add-nipd').value = ''; document.getElementById('add-nama-siswa').value = '';
            } catch (err) {
                console.error(err);
                alert('Gagal menambah siswa: ' + (err.message || err));
            }
        }

        async function importSiswa() {
            const activeId = document.getElementById('select-active-rombel').value;
            const raw = document.getElementById('import-siswa').value.trim();
            const rombel = dbRombel.find(r => r.id === activeId);
            if (!rombel) return alert('Pilih kelas terlebih dahulu.');
            if (!raw) return alert('Isi data terlebih dahulu.');

            const rows = [];
            raw.split('\n').forEach(line => {
                const parts = line.split(',').map(s => s.trim());
                if (parts.length >= 3) {
                    const [nisn, nipd, nama, jk = 'L'] = parts.length >= 4 ? parts : [parts[0], '-', parts[1], parts[2]];
                    rows.push({ nisn, nipd, nama, jk: jk.toUpperCase() });
                }
            });

            if (rows.length === 0) return alert('Tidak ada baris valid untuk diimpor.');

            try {
                await CC.importSiswa(activeId, rows);
                const terbaru = await CC.getRombel();
                dbRombel = terbaru;
                renderRombel();
                document.getElementById('import-siswa').value = '';
                alert(`${rows.length} siswa berhasil diimpor.`);
            } catch (err) {
                console.error(err);
                alert('Gagal impor siswa: ' + (err.message || err));
            }
        }

        async function hapusSiswa(siswaId) {
            const siswa = dbRombel.flatMap(r => r.siswa).find(s => s.id === siswaId);
            if (!siswa) return;
            if (!confirm(`Hapus permanen siswa "${siswa.nama}"?\n\nGunakan tombol ini HANYA untuk salah input. Untuk siswa pindah/berhenti gunakan tombol status agar riwayat presensi tetap tersimpan.`)) return;
            try {
                await CC.deleteSiswa(siswaId);
                dbRombel = await CC.getRombel();
                renderRombel();
            } catch (err) {
                console.error(err);
                alert('Gagal menghapus siswa: ' + (err.message || err));
            }
        }

        function exportExcelSiswa() {
            const activeId = document.getElementById('select-active-rombel').value;
            const rombel = dbRombel.find(r => r.id === activeId);
            if (!rombel) return;
            const hanyaAktif = document.getElementById('filter-aktif').checked;
            const daftar = hanyaAktif ? rombel.siswa.filter(s => (s.status || 'aktif') === 'aktif') : rombel.siswa;
            let table = `<table border="1"><tr><th colspan="7">DAFTAR SISWA KELAS ${escapeHtml(rombel.nama)}${rombel.tahun_ajaran ? ' — ' + escapeHtml(rombel.tahun_ajaran) : ''}</th></tr><tr><th>No</th><th>NISN</th><th>NIPD</th><th>Nama</th><th>JK</th><th>Status</th><th>Keterangan</th></tr>`;
            daftar.forEach((s, idx) => { table += `<tr><td>${idx+1}</td><td>'${escapeHtml(s.nisn)}</td><td>${escapeHtml(s.nipd || '-')}</td><td>${escapeHtml(s.nama)}</td><td>${escapeHtml(s.jk)}</td><td>${STATUS_LABEL[s.status] || 'Aktif'}</td><td>${escapeHtml(s.keterangan || '')}</td></tr>`; }); table += `</table>`; const blob = new Blob(['\ufeff' + table], { type: 'application/vnd.ms-excel' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Siswa_${rombel.nama}.xls`; a.click();
        }

        function logout() { CC.logout().finally(() => { window.location.href = 'index.html'; }); }
    </script>
</body>
</html>
